<g font-family="Arial,Helvetica,sans-serif"><text x="60" y="65" fill="#f6dd9d" font-size="32" font-weight="700">The themed enemy roster</text><text x="60" y="98" fill="#a8b8c8" font-size="17">Definition counts include normal enemies, elites, bosses, and summoned minions.</text><text x="60" y="156" fill="#d9e0e6" font-size="17">Gilded Ruins</text><rect x="300" y="137" width="532" height="25" rx="4" fill="#ccaa67"/><text x="847" y="156" fill="#eee4ce" font-size="17">14</text><text x="60" y="194" fill="#d9e0e6" font-size="17">Ashen Wilds</text><rect x="300" y="175" width="646" height="25" rx="4" fill="#ccaa67"/><text x="961" y="194" fill="#eee4ce" font-size="17">17</text><text x="60" y="232" fill="#d9e0e6" font-size="17">Drowned Quarter</text><rect x="300" y="213" width="608" height="25" rx="4" fill="#ccaa67"/><text x="923" y="232" fill="#eee4ce" font-size="17">16</text><text x="60" y="270" fill="#d9e0e6" font-size="17">Crimson Foundry</text><rect x="300" y="251" width="608" height="25" rx="4" fill="#6fbca6"/><text x="923" y="270" fill="#eee4ce" font-size="17">16</text><text x="60" y="308" fill="#d9e0e6" font-size="17">Hollowwood</text><rect x="300" y="289" width="608" height="25" rx="4" fill="#6fbca6"/><text x="923" y="308" fill="#eee4ce" font-size="17">16</text><text x="60" y="346" fill="#d9e0e6" font-size="17">Shattered Observatory</text><rect x="300" y="327" width="570" height="25" rx="4" fill="#6fbca6"/><text x="885" y="346" fill="#eee4ce" font-size="17">15</text><text x="60" y="384" fill="#d9e0e6" font-size="17">Black Cathedral</text><rect x="300" y="365" width="608" height="25" rx="4" fill="#9290cf"/><text x="923" y="384" fill="#eee4ce" font-size="17">16</text><text x="60" y="422" fill="#d9e0e6" font-size="17">Fractured Realm</text><rect x="300" y="403" width="570" height="25" rx="4" fill="#9290cf"/><text x="885" y="422" fill="#eee4ce" font-size="17">15</text><text x="60" y="460" fill="#d9e0e6" font-size="17">Gilded Throne</text><rect x="300" y="441" width="570" height="25" rx="4" fill="#9290cf"/><text x="885" y="460" fill="#eee4ce" font-size="17">15</text><text x="60" y="510" fill="#a8b8c8" font-size="16">140 themed + 12 act-shared + 17 original Vault definitions = 169 total.</text></g></svg>