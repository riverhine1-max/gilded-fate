<g font-family="Arial,Helvetica,sans-serif"><text x="65" y="74" fill="#8bd8c4" font-size="14" letter-spacing="4">THE RELIQUARY</text><text x="62" y="127" fill="#f6dd9d" font-size="44" font-weight="700">FATE SHARDS</text><text x="65" y="166" fill="#c0c7d1" font-size="21">Attune. Charge. Awaken. Decide what to sacrifice.</text><circle cx="840" cy="142" r="72" fill="#101820" stroke="#655439" stroke-width="3"/><circle cx="840" cy="142" r="63" fill="none" stroke="#7ff0d0" stroke-width="5" stroke-dasharray="290 106" transform="rotate(-90 840 142)"/><path d="M840 90l25 50-25 57-26-57z" fill="#7ff0d0" opacity=".9"/><path d="M840 90v107" stroke="#fff1cd" opacity=".7"/><circle cx="1030" cy="142" r="72" fill="#101820" stroke="#655439" stroke-width="3"/><circle cx="1030" cy="142" r="63" fill="none" stroke="#f3b270" stroke-width="5" stroke-dasharray="290 106" transform="rotate(-90 1030 142)"/><path d="M1030 90l25 50-25 57-26-57z" fill="#f3b270" opacity=".9"/><path d="M1030 90v107" stroke="#fff1cd" opacity=".7"/><path d="M65 216h1070" stroke="#514830"/><text x="65" y="266" fill="#eee4ce" font-size="24">2 carried</text><text x="360" y="266" fill="#eee4ce" font-size="24">1 active per combat</text><text x="795" y="266" fill="#eee4ce" font-size="24">3 normal activations</text><text x="65" y="310" fill="#8ba0b3" font-size="17">Stable I</text><text x="360" y="310" fill="#8ba0b3" font-size="17">Stable II</text><text x="795" y="310" fill="#edb274" font-size="17">Fractured finale</text></g></svg>