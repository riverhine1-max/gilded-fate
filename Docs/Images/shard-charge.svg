<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="425" viewBox="0 0 1200 425" role="img" aria-labelledby="title desc">
<title id="title">Charge targets: Attune 9, unmatched archetype 7, Hold 12</title><desc id="desc">Documentation artwork for Gilded Fate. Text and charts are described in the adjacent README.</desc>
<defs><linearGradient id="bg"><stop stop-color="#101a24"/><stop offset="1" stop-color="#080b12"/></linearGradient><linearGradient id="gold" x2="0.6" y2="1"><stop stop-color="#ffe6a1"/><stop offset="1" stop-color="#9b702a"/></linearGradient><linearGradient id="gem" x2="1" y2="1"><stop stop-color="#8bffe1"/><stop offset="1" stop-color="#15766c"/></linearGradient></defs>
<rect width="1200" height="425" rx="20" fill="url(#bg)"/><rect x="16" y="16" width="1168" height="393" rx="12" fill="none" stroke="#78633c"/>
<g font-family="Arial,Helvetica,sans-serif"><text x="60" y="65" fill="#f6dd9d" font-size="32" font-weight="700">How much charge is required?</text><text x="60" y="100" fill="#a8b8c8" font-size="17">A matching natural card play gives +2; every other natural play gives +1.</text><text x="60" y="169" fill="#d9e0e6" font-size="17">Attune: recognized matching archetype</text><rect x="460" y="145" width="423" height="33" rx="4" fill="#6fbca6"/><text x="898" y="169" fill="#eee4ce" font-size="20">9</text><text x="60" y="236" fill="#d9e0e6" font-size="17">Attune: archetype without a match rule</text><rect x="460" y="212" width="329" height="33" rx="4" fill="#ccaa67"/><text x="804" y="236" fill="#eee4ce" font-size="20">7</text><text x="60" y="303" fill="#d9e0e6" font-size="17">Hold: keep both shards eligible</text><rect x="460" y="279" width="564" height="33" rx="4" fill="#9290cf"/><text x="1039" y="303" fill="#eee4ce" font-size="20">12</text><text x="60" y="385" fill="#a8b8c8" font-size="16">Charge is shared for the combat, capped at the target, and does not carry between combats.</text></g></svg>